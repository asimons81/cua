name: Temporary CUA 2669 repair gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'tony/rebase-cua-wayland-manifest-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply Linux-scoped manifest feature contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('libs/cua-driver/rust/crates/cua-driver/src/cli.rs')
          text = path.read_text()

          helper_anchor = '/// Build the JSON manifest document. Pure function'
          helper = '''fn manifest_feature_flags(
              target_is_linux: bool,
              portal_input_enabled: bool,
              portal_capture_enabled: bool,
          ) -> (bool, bool, bool) {
              (
                  target_is_linux,
                  target_is_linux && portal_input_enabled,
                  target_is_linux && portal_capture_enabled,
              )
          }

          '''
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'expected one manifest helper anchor, found {text.count(helper_anchor)}')
          if 'fn manifest_feature_flags(' in text:
              raise SystemExit('manifest_feature_flags already exists')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          build_start = text.index('pub fn build_manifest() -> serde_json::Value {')
          json_anchor = '    serde_json::json!({\n'
          json_pos = text.index(json_anchor, build_start)
          feature_vars = '''    let (wayland_native, portal_input, portal_capture) = manifest_feature_flags(
              cfg!(target_os = "linux"),
              cfg!(feature = "portal-input"),
              cfg!(feature = "portal-capture"),
          );

          '''
          text = text[:json_pos] + feature_vars + text[json_pos:]

          binary_anchor = '        "binary_path": binary,\n'
          binary_pos = text.index(binary_anchor, json_pos + len(feature_vars)) + len(binary_anchor)
          feature_block = '''        // A release version cannot prove which optional Linux features were
              // compiled into this artifact. Downstream hosts use this additive,
              // machine-readable map to decide whether native Wayland may be
              // auto-enabled safely.
              "features": {
                  "wayland_native": wayland_native,
                  "portal_input": portal_input,
                  "portal_capture": portal_capture,
              },
          '''
          text = text[:binary_pos] + feature_block + text[binary_pos:]

          test_anchor = '    /// Every subcommand entry has the same JSON shape'
          if text.count(test_anchor) != 1:
              raise SystemExit(f'expected one manifest test anchor, found {text.count(test_anchor)}')
          tests = '''    #[test]
              fn manifest_features_match_target_and_build_flags() {
                  let manifest = build_manifest();
                  let features = manifest
                      .get("features")
                      .and_then(|value| value.as_object())
                      .expect("features is an object");

                  for key in ["wayland_native", "portal_input", "portal_capture"] {
                      assert!(
                          features.get(key).and_then(|value| value.as_bool()).is_some(),
                          "features.{key} must be a boolean"
                      );
                  }
                  assert_eq!(
                      features.get("wayland_native").and_then(|value| value.as_bool()),
                      Some(cfg!(target_os = "linux"))
                  );
                  assert_eq!(
                      features.get("portal_input").and_then(|value| value.as_bool()),
                      Some(cfg!(all(target_os = "linux", feature = "portal-input")))
                  );
                  assert_eq!(
                      features.get("portal_capture").and_then(|value| value.as_bool()),
                      Some(cfg!(all(target_os = "linux", feature = "portal-capture")))
                  );
              }

              #[test]
              fn manifest_never_advertises_linux_portal_features_on_non_linux_targets() {
                  // Simulate a non-Linux artifact with both Cargo features enabled.
                  // This makes the cross-target invariant testable on every CI host.
                  assert_eq!(
                      manifest_feature_flags(false, true, true),
                      (false, false, false)
                  );
              }

          '''
          text = text.replace(test_anchor, tests + test_anchor, 1)
          path.write_text(text)
          PY

      - name: Validate focused Rust contract
        working-directory: libs/cua-driver/rust
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p cua-driver manifest_has_documented_top_level_shape --no-default-features
          cargo test -p cua-driver manifest_features_match_target_and_build_flags --no-default-features
          cargo test -p cua-driver manifest_never_advertises_linux_portal_features_on_non_linux_targets --no-default-features

      - name: Commit only after validation
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .tony-cua-2669-repair-trigger
          git add libs/cua-driver/rust/crates/cua-driver/src/cli.rs
          git add -u .tony-cua-2669-repair-trigger || true
          git diff --cached --check
          git commit -m 'feat(cua-driver): advertise Linux Wayland build features'
          git push origin HEAD:"$HEAD_REF"
